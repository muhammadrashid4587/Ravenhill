# Fly.io deployment config — Phase 0 demo
# Deploy with: fly launch / fly deploy

app = "e-agent-demo"
primary_region = "iad"

[build]
  dockerfile = "infra/Dockerfile.api"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
