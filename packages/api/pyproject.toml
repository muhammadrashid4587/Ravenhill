[project]
name = "e-agent-api"
version = "0.1.0"
description = "Ravenhill backend — per-employee autonomous agents for enterprise"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "anthropic>=0.49.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "cerebras-cloud-sdk>=1.0.0",
    "groq>=0.9.0",
    "google-genai>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "aiosqlite>=0.20.0",
]
phase1 = [
    "alembic>=1.13.0",
    "pgvector>=0.2.0",
    "redis>=5.0.0",
    "websockets>=12.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.25.0",
]

[tool.setuptools.packages.find]
include = ["agents*", "messaging*", "registry*", "approvals*", "permissions*", "admin*", "integrations*", "activity*", "meetings*", "security*", "events*", "graph*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
