# Fly.io deployment config — Ravenhill API
# Deploy with: fly deploy --config infra/fly.toml --dockerfile infra/Dockerfile.api

app = "ravenhill-api"
primary_region = "iad"

[build]
  dockerfile = "infra/Dockerfile.api"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
