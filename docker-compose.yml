services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eagent
      POSTGRES_PASSWORD: eagent
      POSTGRES_DB: eagent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
